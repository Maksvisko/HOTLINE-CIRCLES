name: Project checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate archives, assets, HTML connections and JavaScript
        run: python tools/check_project.py
      - name: Test desktop resource paths
        run: python -m unittest discover -s tests -v
